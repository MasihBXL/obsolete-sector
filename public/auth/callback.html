<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authenticating // MOPTAM Sector</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tahoma', sans-serif; }
        body {
            background: #2258a6;
            color: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .xp-dialog {
            background: #ece9d8;
            border: 2px solid;
            border-color: #ffffff #808080 #808080 #ffffff;
            box-shadow: 2px 2px 10px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
        }
        .xp-titlebar {
            background: linear-gradient(180deg, #0058ee 0%, #3593ff 4%, #0054e3 40%, #0041a8 100%);
            color: #ffffff;
            padding: 5px 8px;
            font-size: 12px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .xp-body {
            padding: 20px;
            text-align: center;
        }
        .xp-status {
            font-size: 13px;
            margin: 12px 0;
            color: #0c327d;
            font-weight: bold;
        }
        .xp-spinner {
            width: 32px;
            height: 32px;
            border: 4px solid #7f9db9;
            border-top: 4px solid #0055ea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .error-box {
            background: #ffe6e6;
            border: 1px solid #cc0000;
            color: #990000;
            padding: 12px;
            font-size: 12px;
            margin: 12px 0;
            text-align: left;
            border-radius: 2px;
        }
        .xp-btn {
            background: linear-gradient(180deg, #ffffff 0%, #ece9d8 20%, #d4d0c8 85%, #b8b4a8 100%);
            border: 1px solid #003c74;
            padding: 6px 16px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
        }
    </style>
</head>
<body>
    <div class="xp-dialog">
        <div class="xp-titlebar">
            <span>Identity Authorization // Verifying Transmission</span>
            <span style="font-size: 10px;">[SYS_SEC]</span>
        </div>
        <div class="xp-body" id="dialogBody">
            <div class="xp-spinner" id="spinner"></div>
            <div class="xp-status" id="statusMsg">Completing OAuth authentication...</div>
            <p style="font-size: 11px; color: #555;">Handshaking with MOPTAM security mainframe...</p>
        </div>
    </div>

    <script>
        (function() {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const token = params.get('token');
            const username = params.get('username');
            const provider = params.get('provider');
            const providerId = params.get('providerId');
            const email = params.get('email');
            const suggestedName = params.get('suggestedName');
            const avatar = params.get('avatar');
            const error = params.get('error');

            const statusMsg = document.getElementById('statusMsg');
            const spinner = document.getElementById('spinner');

            if (error) {
                spinner.style.display = 'none';
                statusMsg.textContent = 'Authorization Failed';
                document.getElementById('dialogBody').innerHTML = `
                    <div class="error-box">
                        <strong>Error:</strong> ${decodeURIComponent(error)}
                    </div>
                    <button class="xp-btn" onclick="window.close();">Close Window</button>
                `;
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'OAUTH_CALLBACK',
                        status: 'error',
                        error: decodeURIComponent(error)
                    }, window.location.origin);
                }
                return;
            }

            const payload = {
                type: 'OAUTH_CALLBACK',
                status: status || 'success',
                token,
                username,
                provider,
                providerId,
                email,
                suggestedName,
                avatar
            };

            if (window.opener) {
                // Post message to parent window and close popup
                window.opener.postMessage(payload, window.location.origin);
                statusMsg.textContent = 'Identity verified! Closing window...';
                setTimeout(() => {
                    window.close();
                }, 400);
            } else {
                // Direct navigation fallback (not a popup)
                if (status === 'success' && token) {
                    localStorage.setItem('auth_token', token);
                    window.location.href = '/#home';
                } else if (status === 'new_user') {
                    sessionStorage.setItem('pending_social', JSON.stringify({
                        provider,
                        providerId,
                        email,
                        suggestedName,
                        avatar
                    }));
                    window.location.href = '/#home?choose_callsign=1';
                } else {
                    window.location.href = '/#home';
                }
            }
        })();
    </script>
</body>
</html>
