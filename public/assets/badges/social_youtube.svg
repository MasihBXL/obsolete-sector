<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="crt-glow-yt" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- CRT Monitor Frame -->
  <rect x="3" y="5" width="42" height="34" rx="4" fill="#181818" stroke="#333333" stroke-width="2" filter="url(#crt-glow-yt)"/>
  <!-- Bezel -->
  <rect x="6" y="8" width="36" height="28" rx="3" fill="#282828"/>
  <!-- CRT Screen (YouTube Red Tube) -->
  <rect x="8" y="10" width="32" height="24" rx="4" fill="#cc0000"/>
  <!-- Screen Highlight Glare -->
  <path d="M9 11 L39 11 L37 17 L11 17 Z" fill="#ff4d4d" opacity="0.6"/>
  <!-- White Play Triangle -->
  <polygon points="21,16 30,22 21,28" fill="#ffffff"/>
  <!-- CRT Scanlines -->
  <line x1="8" y1="14" x2="40" y2="14" stroke="#880000" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="18" x2="40" y2="18" stroke="#880000" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="22" x2="40" y2="22" stroke="#880000" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="26" x2="40" y2="26" stroke="#880000" stroke-width="0.8" opacity="0.4"/>
  <line x1="8" y1="30" x2="40" y2="30" stroke="#880000" stroke-width="0.8" opacity="0.4"/>
  <!-- Monitor Stand Base -->
  <rect x="18" y="39" width="12" height="4" rx="1" fill="#444444" stroke="#222222" stroke-width="1"/>
  <rect x="14" y="42" width="20" height="2" rx="1" fill="#666666"/>
</svg>
