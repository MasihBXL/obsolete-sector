<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="shadow-ig" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Classic Retro Camera Body -->
  <rect x="4" y="8" width="40" height="34" rx="7" fill="#d9d2c2" stroke="#4a4234" stroke-width="2" filter="url(#shadow-ig)"/>
  <!-- Top Metal Trim Bar -->
  <path d="M5 14 L43 14 L43 11 C43 9.3 41.7 8 40 8 L8 8 C6.3 8 5 9.3 5 11 Z" fill="#8c8270"/>
  <!-- Rainbow Vintage Stripe -->
  <rect x="5" y="14" width="4" height="27" fill="#ff0000"/>
  <rect x="9" y="14" width="3" height="27" fill="#ff8800"/>
  <rect x="12" y="14" width="3" height="27" fill="#ffee00"/>
  <rect x="15" y="14" width="3" height="27" fill="#00bb22"/>
  <rect x="18" y="14" width="3" height="27" fill="#0088ff"/>
  <!-- Viewfinder Window -->
  <rect x="34" y="10" width="6" height="5" rx="1" fill="#111111" stroke="#555555" stroke-width="1"/>
  <!-- Flash Bulb -->
  <circle cx="28" cy="12" r="2.5" fill="#ffffff" stroke="#999999" stroke-width="1"/>
  <!-- Camera Lens Outer Ring -->
  <circle cx="28" cy="27" r="11" fill="#222222" stroke="#555555" stroke-width="2"/>
  <!-- Lens Glass Element -->
  <circle cx="28" cy="27" r="7.5" fill="#0d1d2d" stroke="#00b4d8" stroke-width="1.5"/>
  <!-- Lens Reflection -->
  <circle cx="26" cy="25" r="2.5" fill="#ffffff" opacity="0.8"/>
  <circle cx="30" cy="29" r="1.2" fill="#38bdf8" opacity="0.6"/>
</svg>
