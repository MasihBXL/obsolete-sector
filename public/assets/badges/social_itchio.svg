<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <filter id="shadow-itch" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <!-- Itch.io Crimson Red Controller Body -->
  <rect x="3" y="6" width="42" height="36" rx="6" fill="#fa5c5c" stroke="#c0392b" stroke-width="2" filter="url(#shadow-itch)"/>
  <!-- Bevel Inner Plate -->
  <rect x="5" y="8" width="38" height="32" rx="4" fill="#ff6b6b"/>

  <!-- Pixel D-Pad (Left) -->
  <rect x="11" y="21" width="10" height="4" rx="1" fill="#ffffff"/>
  <rect x="14" y="18" width="4" height="10" rx="1" fill="#ffffff"/>
  <rect x="14" y="21" width="4" height="4" fill="#dddddd"/>

  <!-- Middle Grille Slots -->
  <rect x="23" y="20" width="2" height="6" rx="1" fill="#c0392b"/>
  <rect x="27" y="20" width="2" height="6" rx="1" fill="#c0392b"/>

  <!-- Action Buttons (Right) -->
  <circle cx="35" cy="20" r="2.5" fill="#ffffff"/>
  <circle cx="39" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="31" cy="24" r="2.5" fill="#ffffff"/>
  <circle cx="35" cy="28" r="2.5" fill="#ffffff"/>

  <!-- Top Cartridge Groove Ridge -->
  <rect x="12" y="10" width="24" height="2" rx="1" fill="#c0392b" opacity="0.6"/>
  <!-- Bottom Grips -->
  <path d="M5 34 C5 38 9 40 13 40 L16 38 L5 34 Z" fill="#c0392b" opacity="0.3"/>
  <path d="M43 34 C43 38 39 40 35 40 L32 38 L43 34 Z" fill="#c0392b" opacity="0.3"/>
</svg>
