<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="amberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Black Background -->
  <rect x="2" y="2" width="124" height="124" rx="8" fill="#0d0800" stroke="#ffb000" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="6" fill="#050300"/>

  <!-- Amber Scanlines -->
  <g opacity="0.25" stroke="#ffb000" stroke-width="1">
    <line x1="6" y1="14" x2="122" y2="14"/>
    <line x1="6" y1="22" x2="122" y2="22"/>
    <line x1="6" y1="30" x2="122" y2="30"/>
    <line x1="6" y1="38" x2="122" y2="38"/>
    <line x1="6" y1="46" x2="122" y2="46"/>
    <line x1="6" y1="54" x2="122" y2="54"/>
    <line x1="6" y1="62" x2="122" y2="62"/>
    <line x1="6" y1="70" x2="122" y2="70"/>
    <line x1="6" y1="78" x2="122" y2="78"/>
    <line x1="6" y1="86" x2="122" y2="86"/>
    <line x1="6" y1="94" x2="122" y2="94"/>
    <line x1="6" y1="102" x2="122" y2="102"/>
    <line x1="6" y1="110" x2="122" y2="110"/>
    <line x1="6" y1="118" x2="122" y2="118"/>
  </g>

  <!-- Radiation / Amber Telemetry Vector Icon -->
  <g filter="url(#amberGlow)" stroke="#ffb000" fill="none">
    <!-- Radar Reticle Rings -->
    <circle cx="64" cy="64" r="50" stroke-width="1.5" stroke-dasharray="6 3"/>
    <circle cx="64" cy="64" r="36" stroke-width="1" opacity="0.6"/>
    <circle cx="64" cy="64" r="22" stroke-width="1" stroke-dasharray="2 4"/>
    
    <!-- Crosshairs -->
    <line x1="14" y1="64" x2="114" y2="64" stroke-width="1" opacity="0.4"/>
    <line x1="64" y1="14" x2="64" y2="114" stroke-width="1" opacity="0.4"/>

    <!-- Radiation Trefoil Blades -->
    <!-- Blade Top -->
    <path d="M 52,43 C 58,36 70,36 76,43 L 68,54 C 66,52 62,52 60,54 Z" fill="#ffb000" stroke-width="1.5"/>
    <!-- Blade Bottom Right -->
    <path d="M 83,67 C 86,74 80,84 72,86 L 68,74 C 70,73 71,70 70,68 Z" fill="#ffb000" stroke-width="1.5"/>
    <!-- Blade Bottom Left -->
    <path d="M 45,67 C 42,74 48,84 56,86 L 60,74 C 58,73 57,70 58,68 Z" fill="#ffb000" stroke-width="1.5"/>

    <!-- Center Core -->
    <circle cx="64" cy="64" r="6" fill="#ffb000"/>
    <circle cx="64" cy="64" r="2" fill="#000000"/>

    <!-- Telemetry Text -->
    <text x="12" y="24" font-family="monospace" font-size="9" fill="#ffb000" font-weight="bold" stroke="none">RAD//60Hz</text>
  </g>
</svg>
