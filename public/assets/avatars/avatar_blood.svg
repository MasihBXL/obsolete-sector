<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bloodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f0303"/>
      <stop offset="100%" stop-color="#080000"/>
    </linearGradient>
    <filter id="bloodGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ff2a2a" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="124" height="124" rx="6" fill="url(#bloodBg)" stroke="#800a0a" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="4" fill="#0d0202" stroke="#400000" stroke-width="1.5"/>

  <!-- Subtle Dark Noise Bars -->
  <g opacity="0.2" fill="#ff2a2a">
    <rect x="6" y="20" width="116" height="2"/>
    <rect x="6" y="44" width="116" height="3"/>
    <rect x="6" y="78" width="116" height="2"/>
    <rect x="6" y="104" width="116" height="4"/>
  </g>

  <!-- Blood Noir Crimson Eye / Surveillance Camera Lens -->
  <g filter="url(#bloodGlow)">
    <!-- Eye / Aperture outer contour -->
    <path d="M 20,64 Q 64,26 108,64 Q 64,102 20,64 Z" fill="#1f0505" stroke="#ff2a2a" stroke-width="2.5"/>

    <!-- Iris / Shutter Outer Ring -->
    <circle cx="64" cy="64" r="24" fill="#2d0505" stroke="#ff2a2a" stroke-width="2"/>
    
    <!-- Shutter Blades -->
    <path d="M 64,40 L 76,52 L 64,64 Z" fill="#660a0a" stroke="#ff2a2a" stroke-width="1"/>
    <path d="M 88,64 L 76,76 L 64,64 Z" fill="#660a0a" stroke="#ff2a2a" stroke-width="1"/>
    <path d="M 64,88 L 52,76 L 64,64 Z" fill="#660a0a" stroke="#ff2a2a" stroke-width="1"/>
    <path d="M 40,64 L 52,52 L 64,64 Z" fill="#660a0a" stroke="#ff2a2a" stroke-width="1"/>

    <!-- Pupil Core -->
    <circle cx="64" cy="64" r="10" fill="#ff2a2a"/>
    <circle cx="67" cy="61" r="3" fill="#ffffff"/>

    <!-- Crosshair Target Pins -->
    <line x1="64" y1="20" x2="64" y2="34" stroke="#ff2a2a" stroke-width="2"/>
    <line x1="64" y1="94" x2="64" y2="108" stroke="#ff2a2a" stroke-width="2"/>
    <line x1="12" y1="64" x2="26" y2="64" stroke="#ff2a2a" stroke-width="2"/>
    <line x1="102" y1="64" x2="116" y2="64" stroke="#ff2a2a" stroke-width="2"/>
  </g>

  <!-- REC / Status Pill -->
  <circle cx="16" cy="18" r="4" fill="#ff2a2a"/>
  <text x="24" y="21" font-family="monospace" font-size="8.5" fill="#ff2a2a" font-weight="bold">REC // NOIR</text>
</svg>
