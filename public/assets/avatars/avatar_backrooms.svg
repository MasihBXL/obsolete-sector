<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="backroomsWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfd2a5"/>
      <stop offset="100%" stop-color="#baa775"/>
    </linearGradient>
    <pattern id="monoWallpaper" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 8,0 L 16,8 L 8,16 L 0,8 Z" fill="none" stroke="#a49363" stroke-width="0.8" opacity="0.6"/>
      <circle cx="8" cy="8" r="1.5" fill="#8c7c50" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Frame with Liminal Moldy Border -->
  <rect x="2" y="2" width="124" height="124" rx="4" fill="#695c37" stroke="#483f24" stroke-width="2"/>
  <rect x="5" y="5" width="118" height="118" rx="3" fill="url(#backroomsWall)"/>
  <rect x="5" y="5" width="118" height="118" rx="3" fill="url(#monoWallpaper)"/>

  <!-- Moist Carpet Bottom Base -->
  <rect x="5" y="100" width="118" height="23" fill="#6e6240" opacity="0.75"/>
  <line x1="5" y1="100" x2="123" y2="100" stroke="#4a422b" stroke-width="1.5"/>

  <!-- Backrooms Corner Room Perspective Lines -->
  <line x1="64" y1="5" x2="64" y2="100" stroke="#8a7c52" stroke-width="2" opacity="0.7"/>
  <line x1="5" y1="100" x2="64" y2="100" stroke="#776a44" stroke-width="2"/>
  <line x1="123" y1="100" x2="64" y2="100" stroke="#776a44" stroke-width="2"/>

  <!-- Shadowy Liminal Entity / Wire Silhouette -->
  <!-- Long slender limbs -->
  <path d="M 64,36 C 64,36 62,56 60,78 L 54,106" stroke="#211c10" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 64,36 C 64,36 66,56 68,78 L 74,106" stroke="#211c10" stroke-width="3" stroke-linecap="round" fill="none"/>
  <!-- Arms reaching -->
  <path d="M 62,50 Q 42,60 38,76" stroke="#211c10" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 66,50 Q 86,58 90,74" stroke="#211c10" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Head with glowing hollow eyes -->
  <circle cx="64" cy="34" r="10" fill="#211c10"/>
  <circle cx="61" cy="34" r="1.5" fill="#f8e71c"/>
  <circle cx="67" cy="34" r="1.5" fill="#f8e71c"/>

  <!-- Fluorescent Hum Telemetry -->
  <text x="10" y="20" font-family="monospace" font-size="8.5" fill="#54482b" font-weight="bold">LEVEL 0 // 432Hz</text>
</svg>
