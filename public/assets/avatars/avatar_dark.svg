<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14181f"/>
      <stop offset="100%" stop-color="#080a0d"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Frame -->
  <rect x="2" y="2" width="124" height="124" rx="10" fill="url(#darkBg)" stroke="#2b3442" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="8" fill="#0d1117" stroke="#1f2633" stroke-width="1.5"/>

  <!-- Horizontal scanline pattern -->
  <g opacity="0.15" stroke="#63b3ed" stroke-width="1">
    <line x1="8" y1="16" x2="120" y2="16"/>
    <line x1="8" y1="24" x2="120" y2="24"/>
    <line x1="8" y1="32" x2="120" y2="32"/>
    <line x1="8" y1="40" x2="120" y2="40"/>
    <line x1="8" y1="48" x2="120" y2="48"/>
    <line x1="8" y1="56" x2="120" y2="56"/>
    <line x1="8" y1="64" x2="120" y2="64"/>
    <line x1="8" y1="72" x2="120" y2="72"/>
    <line x1="8" y1="80" x2="120" y2="80"/>
    <line x1="8" y1="88" x2="120" y2="88"/>
    <line x1="8" y1="96" x2="120" y2="96"/>
    <line x1="8" y1="104" x2="120" y2="104"/>
    <line x1="8" y1="112" x2="120" y2="112"/>
  </g>

  <!-- Dark CRT Tactical Operative Silhouette -->
  <!-- Shoulders / Suit -->
  <path d="M 28,110 C 28,94 40,84 52,80 L 76,80 C 88,84 100,94 100,110 Z" fill="#18202c" stroke="#313d52" stroke-width="2"/>
  
  <!-- Tactical Collar -->
  <path d="M 50,80 L 64,92 L 78,80 Z" fill="#0d121a" stroke="#4a5568" stroke-width="1.5"/>

  <!-- Helmet / Head Base -->
  <path d="M 44,48 C 44,32 52,22 64,22 C 76,22 84,32 84,48 C 84,66 78,76 64,76 C 50,76 44,66 44,48 Z" fill="#1b2330" stroke="#3b485e" stroke-width="2"/>

  <!-- Operative HUD / Visor -->
  <path d="M 46,44 Q 64,48 82,44 L 80,56 Q 64,62 48,56 Z" fill="#0b192c" stroke="#63b3ed" stroke-width="2" filter="url(#cyanGlow)"/>
  
  <!-- Glowing Cyan Visor Line -->
  <line x1="50" y1="50" x2="78" y2="50" stroke="#63b3ed" stroke-width="2" filter="url(#cyanGlow)"/>
  <circle cx="54" cy="50" r="1.5" fill="#ffffff"/>
  <circle cx="74" cy="50" r="1.5" fill="#ffffff"/>

  <!-- Crosshair Targeting Marks in Corners -->
  <g stroke="#4a5568" stroke-width="1.5">
    <path d="M 12,20 L 12,12 L 20,12"/>
    <path d="M 116,20 L 116,12 L 108,12"/>
    <path d="M 12,108 L 12,116 L 20,116"/>
    <path d="M 116,108 L 116,116 L 108,116"/>
  </g>
</svg>
