<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#131210"/>
  
  <!-- Industrial Hydraulic Machinery Frame -->
  <rect x="50" y="30" width="540" height="300" fill="#1e1c18" stroke="#3d372e" stroke-width="4"/>
  
  <!-- Massive Hydraulic Piston -->
  <rect x="180" y="60" width="90" height="180" fill="#2d2922" stroke="#524a3c" stroke-width="3"/>
  <rect x="200" y="160" width="50" height="140" fill="#8c826e" stroke="#332e25" stroke-width="2"/>
  
  <!-- Interlocking Gears -->
  <g transform="translate(420, 160)">
    <circle cx="0" cy="0" r="70" fill="#181613" stroke="#5e5443" stroke-width="6"/>
    <!-- Gear Teeth -->
    <rect x="-8" y="-85" width="16" height="20" fill="#5e5443"/>
    <rect x="-8" y="65" width="16" height="20" fill="#5e5443"/>
    <rect x="-85" y="-8" width="20" height="16" fill="#5e5443"/>
    <rect x="65" y="-8" width="20" height="16" fill="#5e5443"/>
    <circle cx="0" cy="0" r="25" fill="#29251f" stroke="#85775f" stroke-width="3"/>
  </g>

  <!-- Rust and Grime Stains -->
  <path d="M 60,40 Q 140,80 160,180 T 170,320" fill="none" stroke="#4a2e16" stroke-width="12" opacity="0.4"/>
  <path d="M 490,40 Q 520,120 500,240" fill="none" stroke="#38210f" stroke-width="8" opacity="0.5"/>

  <!-- Amber Gauge -->
  <circle cx="115" cy="110" r="35" fill="#0d0b08" stroke="#a37e37" stroke-width="3"/>
  <line x1="115" y1="110" x2="135" y2="95" stroke="#ffaa22" stroke-width="3"/>
  <text x="96" y="130" font-family="monospace" font-size="8" fill="#d99b38">KG/CM²</text>

  <!-- Title & Specs -->
  <text x="70" y="310" font-family="'Courier New', monospace" font-size="18" fill="#d4c09d" font-weight="bold" letter-spacing="3">CONCRETE OSCILLATOR // MK-VI</text>
  <text x="70" y="325" font-family="'Courier New', monospace" font-size="10" fill="#8c7858">CAUTION: KEEP CRUSHING ZONE CLEAR OF BIOLOGICAL MATTER</text>
</svg>
