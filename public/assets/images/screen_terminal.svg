<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360">
  <rect width="640" height="360" fill="#080c09"/>
  <!-- CRT Terminal Box -->
  <rect x="20" y="20" width="600" height="320" fill="#0c140e" stroke="#1b3620" stroke-width="3" rx="8"/>
  <rect x="30" y="30" width="580" height="300" fill="#060f08"/>

  <!-- Command Line Interface Text -->
  <text x="50" y="65" font-family="'Courier New', monospace" font-size="14" fill="#30e052">> SYSTEM INITIATING: CHAMBER_INTERFACE_V1.4.2</text>
  <text x="50" y="90" font-family="'Courier New', monospace" font-size="13" fill="#25b341">> MEMORY INTEGRITY: 98.4% OK</text>
  <text x="50" y="115" font-family="'Courier New', monospace" font-size="13" fill="#25b341">> DETECTING ADVERSARY: SURVEILLANCE_UNIT_#09</text>
  <text x="50" y="140" font-family="'Courier New', monospace" font-size="13" fill="#e0c030">> WARNING: LOADED CHAMBER CONTAINS 2 LIVE ROUNDS</text>
  <text x="50" y="165" font-family="'Courier New', monospace" font-size="13" fill="#25b341">> SELECT ACTION:</text>
  <text x="70" y="195" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">[1] POINT SHOTGUN AT ADVERSARY</text>
  <text x="70" y="220" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">[2] POINT SHOTGUN AT YOURSELF</text>
  <text x="70" y="245" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">[3] USE ITEM: MAGNIFYING GLASS</text>
  <text x="70" y="270" font-family="'Courier New', monospace" font-size="13" fill="#ffffff">[4] USE ITEM: HANDCUFFS</text>
  <text x="50" y="305" font-family="'Courier New', monospace" font-size="15" fill="#30e052">> _</text>

  <!-- Scanlines overlay -->
  <line x1="30" y1="50" x2="610" y2="50" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="100" x2="610" y2="100" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="150" x2="610" y2="150" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="200" x2="610" y2="200" stroke="#000" stroke-width="2" opacity="0.3"/>
  <line x1="30" y1="250" x2="610" y2="250" stroke="#000" stroke-width="2" opacity="0.3"/>
</svg>
